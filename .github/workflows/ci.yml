name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Race and contract tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build -o bin/agentic-salmon ./cmd/agentic-salmon
      - name: Durable stdio MCP and HITL proofs
        run: |
          ./bin/agentic-salmon proof-1 --run-id ci-proof
          printf 'APPROVE\n' | ./bin/agentic-salmon proof-2 --run-id ci-proof
          ./bin/agentic-salmon proof-3 --run-id ci-proof
          if ./bin/agentic-salmon proof-3 --run-id ci-proof; then exit 1; fi
          jq -s -e '.[0].result.events[2].evidence.knowledge.mcp_call.success == true and .[1].result.guidance == null and .[2].phase == "completed" and (.[2].result.events | length) == 6' log/ci-proof.log
